name: Opportunity or collaboration
description: Tell me about a project, collaboration, or idea you’re thinking about.
title: "[Opportunity] "
labels:
  - opportunity
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out. Tell me what you’re thinking—it doesn’t need to be polished. Just remember that GitHub issues are public.

  - type: dropdown
    id: opportunity_type
    attributes:
      label: What are you reaching out about?
      options:
        - Building or shaping an idea
        - A client project
        - A partnership or collaboration
        - Architecture or advice
        - Something else
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What’s the idea?
      description: A rough version is completely fine.
      placeholder: I’m thinking about...
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What would make this worth doing?
      placeholder: A good result would be...
    validations:
      required: true

  - type: textarea
    id: audience
    attributes:
      label: Who would this help?
      placeholder: The people, team, customers, or community affected are...
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: What constraints matter?
      description: Include relevant tools, privacy needs, budget, timing, approvals, or technical limits. If none are known yet, say that.
      placeholder: The work needs to account for...
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: How far along is it?
      options:
        - Early idea
        - Defined concept
        - Prototype exists
        - Existing system needs improvement
        - Ready to build
    validations:
      required: true

  - type: checkboxes
    id: public_notice
    attributes:
      label: One quick check
      options:
        - label: I haven’t included passwords, private information, or anything confidential.
          required: true
